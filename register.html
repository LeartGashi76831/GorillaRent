<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GorillaRent - Register</title>
</head>


<body>
    

 <header>
        <h1>GorillaRent</h1>
  

        <nav>
            <ul>
        
   <li><a href="#home">Home</a></li>
   <li><a href="#rreth-nesh">Rreth-nesh</a></li>
   <li><a href="#veturat">Veturat</a></li>
   <li><a href="#login">Login</a></li>
   <li><a href="#register">Register</a></li>

    </ul>
    </nav>
    </header>

    <section class="pjesa-regjistrimit">
        <h2>Krijo llogari</h2>
        <p>Regjistrohu per rezervim veturave</p>

        <form id="registerForm">


            <div>
                <label for="Emri">Emri:</label>
                <input type="text" id="emri" name="emri" required>
            </div>

            <div>
                <label for="Mbiemri">Mbiemri:</label>
                <input type="text" id="mbiemri" name="mbiemri" required>
            </div>

            <div>
                <label for="E-mail:">E-mail:</label>
                <input type="email" id="emri" name="emri" required>
            </div>

            <div>
                <label for="qyteti">Qyteti:</label>
                <select id="qyteti" name="qyteti" required>
                    <option value="">Zgjidh qytetin</option>
                    <option>Prishtine</option>
                    <option>Peje</option>
                    <option>Skenderaj</option>
                    <option>Obiliq</option>
                    <option>Podujeve</option>
                    <option>Ferizaj</option>
                    <option>Tjeter/option>
                </select>
                </div>

                <div>
                <label for="Datelindja">Datelindja:</label>
                <input type="date" id="datelindja" name="datelindja" required>
                </div>

                
                <div>
                <label for="Password">Fjalekalimi:</label>
                <input type="password" id="password" name="password" required>
                </div>

                <div>
                <label for="konfirmimi">Perserit fjalekalimin</label>
                <input type="password" id="konfirmimi" name="konfirmimi" required>
                </div>


                <button type="submit">Regjistrohu</button>

                </form>

                <p>Keni llogari <a href="login.html">Hyr ketu</a></p>

                </section>

                <footer>
                    <p>2026 GorillaRent. Te gjitha te drejtat e rezervuara</p>
                </footer>


            </div>
        </form>
    </section>

            




</body>
</html>
